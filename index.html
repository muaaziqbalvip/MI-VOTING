        * {

        /* DIGITAL BACKGROUND MAGIC (Particles) */

        /* SPLASH SCREEN */

            position: fixed; inset: 0; background: radial-gradient(circle, #111, #000);
            z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 1s ease;

        .splash-logo { width: 120px; animation: pulseGlow 2s infinite alternate; }
        .splash-text { margin-top: 20px; font-size: 24px; font-weight: 800; letter-spacing: 2px; color: var(--neon-blue); }
        .splash-sub { font-size: 12px; color: #888; margin-top: 5px; text-transform: uppercase; }
        .loader-bar { width: 200px; height: 4px; background: #333; margin-top: 20px; border-radius: 5px; overflow: hidden; }
        .loader-fill { height: 100%; background: var(--neon-purple); width: 0%; box-shadow: 0 0 10px var(--neon-purple); }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 10px var(--neon-blue)) scale(1); }
            100% { filter: drop-shadow(0 0 30px var(--neon-purple)) scale(1.1); }
        }

        /* AUTH SCREEN (Login) */
        #auth-screen {
            position: fixed; inset: 0; background: rgba(5,5,8,0.95);
            backdrop-filter: blur(20px); z-index: 9999; display: flex;

        .wa-footer { padding: 5px 10px 10px; display: flex; justify-content: space-between; font-size: 11px; color: #888; }

    </style>

    <script>
        // 1. Particle Background Logic (HTML Canvas)
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particlesArray = [];
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = Math.random() > 0.5 ? '#00f2ff' : '#bc13fe';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.01;
                if(this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2;
                }
            }
            draw() {
                ctx.fillStyle = this.color; ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        function initParticles() { for(let i=0; i<100; i++) particlesArray.push(new Particle()); }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<particlesArray.length; i++){ particlesArray[i].update(); particlesArray[i].draw(); }
            requestAnimationFrame(animateParticles);
        }
        initParticles(); animateParticles();

        // 2. Firebase Configuration (From User)
        const firebaseConfig = {
            apiKey: "AIzaSyBbnU8DkthpYQMHOLLyj6M0cc05qXfjMcw",
            authDomain: "ramadan-2385b.firebaseapp.com",
            databaseURL: "https://ramadan-2385b-default-rtdb.firebaseio.com",
            projectId: "ramadan-2385b",
            storageBucket: "ramadan-2385b.firebasestorage.app",
            messagingSenderId: "882828936310",
            appId: "1:882828936310:web:7f97b921031fe130fe4b57"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 3. User Identity Management (Optional Fields Logic)
        let currentUser = { id: "", name: "", phone: "", image: "", isAdmin: false };

        // Splash Screen Loader Animation
        window.onload = () => {
            gsap.to("#loader-fill", { width: "100%", duration: 2, ease: "power2.inOut", onComplete: checkUserIdentity });
        };

        function checkUserIdentity() {
            document.getElementById('splash-screen').style.opacity = "0";
            setTimeout(() => { document.getElementById('splash-screen').style.display = "none"; }, 1000);

            let storedId = localStorage.getItem('mi_uid');
            if(storedId) {
                // Load existing user
                currentUser.id = storedId;
                currentUser.name = localStorage.getItem('mi_name');
                currentUser.phone = localStorage.getItem('mi_phone') || "Not Provided";
                currentUser.image = localStorage.getItem('mi_image') || "https://via.placeholder.com/150/000000/00f2ff?text="+currentUser.name.charAt(0);
                
                // Admin Check Logic (If name contains Admin or specific keywords)
                if(currentUser.name.toLowerCase() === 'admin' || currentUser.name.toLowerCase() === 'maaz') {
                    currentUser.isAdmin = true;
                }

                updateProfileUI();
                startDigitalEngine();
            } else {
                document.getElementById('auth-screen').style.display = "flex";
            }
        }

        function registerUser() {
            let name = document.getElementById('reg-name').value.trim();
            let phone = document.getElementById('reg-phone').value.trim();
            let image = document.getElementById('reg-img').value.trim();

            if(!name) { alert("Name is compulsory!"); return; }
            
            // Generate unique ID since phone is optional
            let uid = "MI_" + Math.random().toString(36).substr(2, 9);
            
            localStorage.setItem('mi_uid', uid);
            localStorage.setItem('mi_name', name);
            if(phone) localStorage.setItem('mi_phone', phone);
            if(image) localStorage.setItem('mi_image', image);

            checkUserIdentity(); // Reload identity
        }

        function updateProfileUI() {
            document.getElementById('user-display-pic').src = currentUser.image;
            document.getElementById('profile-huge-pic').src = currentUser.image;
            document.getElementById('profile-display-name').innerText = currentUser.name + (currentUser.isAdmin ? " 🛡️" : "");
            document.getElementById('profile-display-phone').innerText = currentUser.phone;
        }

        // 4. Start Fetching Real-Time Data
        function startDigitalEngine() {
            fetchWhatsAppPolls();
            fetchMediaAnnouncements();
            fetchLiveChat();
        }

        // =====================================
        // WHATSAPP STYLE POLL GENERATOR
        // =====================================
        function fetchWhatsAppPolls() {
            db.ref('Polls').on('value', (snapshot) => {
                let feed = document.getElementById('polls-feed');
                feed.innerHTML = '';
                
                snapshot.forEach((child) => {
                    let poll = child.val();
                    let pid = child.key;

                    // WhatsApp specific structure
                    let pollHTML = `
                    <div class="wa-post" id="post-${pid}">
                        <div class="wa-post-header">
                            <span>MI VOTING OFFICIAL</span>
                            <span>Live Poll</span>
                        </div>
                        <img src="${poll.image}" class="wa-image" alt="Showdown">
                        <div class="wa-desc">${poll.description}</div>
                        
                        <div class="wa-poll-box" id="poll-box-${pid}">
                            <div class="wa-question"><i class="fas fa-poll" style="color:var(--neon-blue);"></i> ${poll.question}</div>
                            
                            <div class="wa-option" id="optA-${pid}" onclick="castWhatsAppVote('${pid}', 'A', '${poll.optionA}')">
                                <div class="wa-option-icon"><i class="fas fa-check"></i></div>
                                <div class="wa-option-text">${poll.optionA}</div>
                            </div>
                            
                            <div class="wa-option" id="optB-${pid}" onclick="castWhatsAppVote('${pid}', 'B', '${poll.optionB}')">
                                <div class="wa-option-icon"><i class="fas fa-check"></i></div>
                                <div class="wa-option-text">${poll.optionB}</div>
                            </div>
                        </div>
                        <div class="wa-footer">
                            <span>Share Link: ?ref=${pid}</span>
                            <span id="vote-count-${pid}">Total Votes: ${ (poll.counts?.A || 0) + (poll.counts?.B || 0) }</span>
                        </div>
                    </div>`;
                    
                    feed.innerHTML += pollHTML;
                    
                    // Check if strictly voted already (Lock system)
                    db.ref(`Votes/${pid}/${currentUser.id}`).once('value', (vSnap) => {
                        if(vSnap.exists()){
                            let votedOption = vSnap.val().choice; // 'A' or 'B'
                            let box = document.getElementById(`poll-box-${pid}`);
                            box.classList.add('wa-voted');
                            document.getElementById(`opt${votedOption}-${pid}`).classList.add('wa-selected');
                        }
                    });
                });
            });
        }

        function castWhatsAppVote(pollId, choice, candidateName) {
            // Check Lock
            db.ref(`Votes/${pollId}/${currentUser.id}`).once('value', (snap) => {
                if(snap.exists()) {
                    alert("⚠️ Voting Integrity System: You can only vote once!");
                } else {
                    // Record Vote
                    db.ref(`Votes/${pollId}/${currentUser.id}`).set({
                        name: currentUser.name,
                        candidate: candidateName,
                        choice: choice,
                        time: Date.now()
                    });
                    
                    // Increment count safely
                    let countRef = db.ref(`Polls/${pollId}/counts/${choice}`);
                    countRef.transaction(current => (current || 0) + 1);
                    
                    // GSAP Animation for smooth selection
                    gsap.to(`#opt${choice}-${pollId}`, { backgroundColor: "rgba(0,242,255,0.2)", scale: 1.02, duration: 0.3, yoyo: true, repeat: 1 });
                    
                    // Update My Profile History Locally
                    document.getElementById('my-votes-list').innerHTML += `✅ Voted for ${candidateName} <br>`;
                }
            });
        }

        // =====================================
        // ANNOUNCEMENTS (FB & YouTube Embeds)
        // =====================================
        function fetchMediaAnnouncements() {
            db.ref('MediaAnnouncements').on('value', (snapshot) => {
                let feed = document.getElementById('news-feed');
                feed.innerHTML = '';
                
                snapshot.forEach(child => {
                    let media = child.val();
                    let embedHTML = '';
                    
                    // Logic to detect YouTube vs Facebook Link from Admin
                    if(media.link.includes('youtube.com') || media.link.includes('youtu.be')) {
                        // Extract Video ID
                        let vidId = media.link.split('v=')[1] || media.link.split('.be/')[1];
                        embedHTML = `<iframe src="https://www.youtube.com/embed/${vidId}" allowfullscreen></iframe>`;
                    } else if (media.link.includes('facebook.com')) {
                        // FB Embed
                        embedHTML = `<iframe src="https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(media.link)}&show_text=false" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
                    } else {
                        // Normal Image Fallback
                        embedHTML = `<img src="${media.link}" style="width:100%; height:100%; object-fit:cover;">`;
                    }

                    feed.innerHTML += `
                    <div class="news-card">
                        <div class="iframe-container">${embedHTML}</div>
                        <div class="news-content">
                            <div class="news-title">${media.title}</div>
                            <div style="font-size:13px; color:#ccc;">${media.desc}</div>
                        </div>
                    </div>`;
                });
            });
        }

        // =====================================
        // ADMIN CHAT SYSTEM
        // =====================================
        function fetchLiveChat() {
            db.ref('GlobalChat').on('child_added', (snapshot) => {
                let msg = snapshot.val();
                let isMine = (msg.uid === currentUser.id) ? 'mine' : 'other';
                let adminBadge = msg.isAdmin ? '<span class="admin-badge">Admin</span>' : '';
                
                let chatFeed = document.getElementById('chat-feed');
                chatFeed.innerHTML += `
                    <div class="chat-msg ${isMine}">
                        <div class="sender-name">${msg.sender} ${adminBadge}</div>
                        <div class="chat-bubble">${msg.text}</div>
                    </div>
                `;
                chatFeed.scrollTop = chatFeed.scrollHeight;
            });
        }

        function sendChatMessage() {
            let input = document.getElementById('chat-input');
            let text = input.value.trim();
            if(!text) return;

            db.ref('GlobalChat').push({
                uid: currentUser.id,
                sender: currentUser.name,
                isAdmin: currentUser.isAdmin,
                text: text,
                timestamp: Date.now()
            });
            input.value = '';
        }

        // Tab Switching Logic
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

    </script>
    
</body>
</html>
